services:
  mysql:
    image: mysql:8.0
    container_name: changan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changan2026}
      MYSQL_DATABASE: chang_an
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 仅绑定本机回环，避免 MySQL 暴露公网；如需外部管理端可临时改回
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: changan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # 仅绑定本机回环，避免 Redis 暴露公网
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: changan-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://root:changan2026@mysql:3306/chang_an}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      HASHIDS_SALT: ${HASHIDS_SALT:-change-me-in-prod}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      # 由 Nginx 反代接入，应用端口收回内网，避免绕过 Nginx 直连
      - "127.0.0.1:3000:3000"
    # 生产镜像未拷贝 node_modules/.bin，故用完整路径调用 prisma CLI 执行迁移
    command: sh -c "node ./node_modules/prisma/build/index.js migrate deploy && node .output/server/index.mjs"

volumes:
  mysql_data:
  redis_data:
